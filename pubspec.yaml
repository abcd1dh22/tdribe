name: telecloud
description: Telegram-backed personal cloud storage
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  video_player: ^2.9.2
  pdfx: ^2.9.0
dev_dependencies:
  flutter_launcher_icons: 0.14.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 23
flutter:
  uses-material-design: true
